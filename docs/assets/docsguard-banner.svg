<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pramaan — AI Document Authenticity & Fraud Detection">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#F5F8FF"/>
    </linearGradient>
    <linearGradient id="cryTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93C5FD"/><stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="cryBot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#2563EB" opacity="0.10"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="24" fill="url(#dots)"/>
  <rect x="1" y="1" width="1198" height="338" rx="23" fill="none" stroke="#E2E8F0"/>

  <!-- crystal + glow -->
  <circle cx="980" cy="170" r="150" fill="url(#glow)"/>
  <g transform="translate(915 70)">
    <path d="M65 0 L120 56 L65 78 L10 56 Z" fill="url(#cryTop)"/>
    <path d="M10 56 L65 78 L65 200 Z" fill="url(#cryBot)"/>
    <path d="M120 56 L65 78 L65 200 Z" fill="#1E40AF"/>
    <path d="M65 0 L120 56 L65 78 Z" fill="#ffffff" opacity="0.16"/>
    <path d="M35 44 L52 61 L47 66 L30 49 Z" fill="#ffffff"/>
    <path d="M47 66 L58 55 L63 60 L52 71 Z" fill="#ffffff"/>
  </g>

  <!-- shield mark -->
  <g transform="translate(72 66)">
    <rect width="52" height="52" rx="14" fill="#2563EB"/>
    <path d="M26 12 L38 17 V27 C38 34 33 39 26 42 C19 39 14 34 14 27 V17 Z" fill="#ffffff"/>
    <path d="M21 27 l4 4 l8 -9" stroke="#2563EB" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="140" y="104" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#0F172A" letter-spacing="-1">Pramaan</text>
  <text x="74" y="176" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1E40AF">AI Document Authenticity &amp; Fraud Detection</text>
  <text x="74" y="214" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#475569">Upload any document — know in seconds if it's real. Powered by Claude.</text>

  <!-- verdict pills -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700">
    <rect x="74" y="248" width="132" height="34" rx="17" fill="#ECFDF5" stroke="#A7F3D0"/>
    <circle cx="94" cy="265" r="5" fill="#10B981"/>
    <text x="106" y="270" fill="#047857">AUTHENTIC</text>

    <rect x="218" y="248" width="140" height="34" rx="17" fill="#FFFBEB" stroke="#FDE68A"/>
    <circle cx="238" cy="265" r="5" fill="#F59E0B"/>
    <text x="250" y="270" fill="#B45309">SUSPICIOUS</text>

    <rect x="370" y="248" width="140" height="34" rx="17" fill="#FEF2F2" stroke="#FECACA"/>
    <circle cx="390" cy="265" r="5" fill="#EF4444"/>
    <text x="402" y="270" fill="#B91C1C">LIKELY FAKE</text>
  </g>
</svg>
