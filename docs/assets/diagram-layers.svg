<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" role="img" aria-labelledby="layersTitle layersDesc">
  <title id="layersTitle">Trust-layer stack</title>
  <desc id="layersDesc">Three layers by epistemic status: PROVEN facts computed in code, REASONED inferences made by the model over evidence, and NOT VERIFIED items that require a live external source and are only ever flagged, never fabricated.</desc>

  <defs>
    <marker id="ly-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="660" fill="#FFFFFF"/>

  <text x="30" y="34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Why it can be trusted — three layers, three different guarantees</text>
  <text x="30" y="56" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569">Every finding in a report is labeled by what kind of claim it actually is.</text>

  <!-- PROVEN -->
  <rect x="30" y="80" width="800" height="150" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="55" y="110" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#047857">PROVEN</text>
  <text x="55" y="130" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#065F46">computed in code — mathematically conclusive, not the model's opinion</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#065F46">
    <rect x="55" y="146" width="140" height="28" rx="14" fill="#FFFFFF" stroke="#10B981"/>
    <text x="125" y="164" text-anchor="middle">SHA-256 hash</text>
    <rect x="205" y="146" width="190" height="28" rx="14" fill="#FFFFFF" stroke="#10B981"/>
    <text x="300" y="164" text-anchor="middle">PDF producer + dates</text>
    <rect x="405" y="146" width="170" height="28" rx="14" fill="#FFFFFF" stroke="#10B981"/>
    <text x="490" y="164" text-anchor="middle">EXIF editor tags</text>
    <rect x="585" y="146" width="190" height="28" rx="14" fill="#FFFFFF" stroke="#10B981"/>
    <text x="680" y="164" text-anchor="middle">OFAC SDN screening</text>
    <rect x="55" y="184" width="320" height="28" rx="14" fill="#FFFFFF" stroke="#10B981"/>
    <text x="215" y="202" text-anchor="middle">Identifier checksums (6 formats)</text>
    <rect x="385" y="184" width="330" height="28" rx="14" fill="#FFFFFF" stroke="#10B981"/>
    <text x="550" y="202" text-anchor="middle">Aadhaar · PAN · GSTIN · IFSC · IBAN · MRZ</text>
  </g>

  <!-- REASONED -->
  <rect x="30" y="255" width="800" height="150" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="55" y="285" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1E40AF">REASONED</text>
  <text x="55" y="305" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1E3A8A">Claude's inference over evidence — sound and evidenced, but a judgement, not a fact</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1E3A8A">
    <rect x="55" y="321" width="180" height="28" rx="14" fill="#FFFFFF" stroke="#2563EB"/>
    <text x="145" y="339" text-anchor="middle">Typography &amp; layout</text>
    <rect x="245" y="321" width="170" height="28" rx="14" fill="#FFFFFF" stroke="#2563EB"/>
    <text x="330" y="339" text-anchor="middle">Cross-field logic</text>
    <rect x="425" y="321" width="190" height="28" rx="14" fill="#FFFFFF" stroke="#2563EB"/>
    <text x="520" y="339" text-anchor="middle">ELA interpretation</text>
    <rect x="55" y="359" width="240" height="28" rx="14" fill="#FFFFFF" stroke="#2563EB"/>
    <text x="175" y="377" text-anchor="middle">Stamps, seals &amp; signatures</text>
    <rect x="305" y="359" width="220" height="28" rx="14" fill="#FFFFFF" stroke="#2563EB"/>
    <text x="415" y="377" text-anchor="middle">Fraud-typology matching</text>
  </g>

  <!-- NOT VERIFIED -->
  <rect x="30" y="430" width="800" height="150" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="55" y="460" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#B91C1C">NOT VERIFIED</text>
  <text x="55" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7F1D1D">needs a live external source DocsGuard did not query — flagged, never invented</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7F1D1D">
    <rect x="55" y="496" width="200" height="28" rx="14" fill="#FFFFFF" stroke="#EF4444"/>
    <text x="155" y="514" text-anchor="middle">Registry / GST / PAN / MCA</text>
    <rect x="270" y="496" width="230" height="28" rx="14" fill="#FFFFFF" stroke="#EF4444"/>
    <text x="385" y="514" text-anchor="middle">DigiLocker / e-District check</text>
    <rect x="515" y="496" width="230" height="28" rx="14" fill="#FFFFFF" stroke="#EF4444"/>
    <text x="630" y="514" text-anchor="middle">Bank balance confirmation</text>
    <rect x="55" y="534" width="480" height="28" rx="14" fill="#FEE2E2" stroke="#EF4444"/>
    <text x="295" y="552" text-anchor="middle" font-weight="700">→ listed honestly in externalChecksNeeded, every time</text>
  </g>

  <!-- Override side note -->
  <line x1="900" y1="90" x2="900" y2="570" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#ly-arrow)"/>
  <rect x="850" y="90" width="220" height="150" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text x="960" y="116" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#B45309">THE ONE RULE</text>
  <text x="870" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#92400E">A PROVEN failure (a checksum</text>
  <text x="870" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#92400E">that fails) overrides REASONED</text>
  <text x="870" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#92400E">judgement and can only push</text>
  <text x="870" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#92400E">risk UP, applied last, never</text>
  <text x="870" y="212" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#92400E">used to lower a verdict.</text>

  <rect x="850" y="540" width="220" height="46" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="960" y="559" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#B45309">NOT VERIFIED never</text>
  <text x="960" y="576" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#B45309">raises or lowers risk either</text>

  <text x="30" y="620" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748B">PROVEN can override REASONED. REASONED can never override PROVEN. NOT VERIFIED is disclosed, not scored.</text>
</svg>
